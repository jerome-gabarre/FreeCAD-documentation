- name: Compiler l'index exhaustif et les 5 packs Markdown purifiés (V2)
        run: |
          python3 - << 'EOF'
          import re
          from pathlib import Path

          wiki_dir = Path("wiki")
          out_dir = Path("_skill_architect")
          out_dir.mkdir(exist_ok=True)

          all_en_md = sorted(
              [f for f in wiki_dir.iterdir() if f.is_file() and f.suffix == ".md"],
              key=lambda p: p.name.lower()
          )

          # Regex de nettoyage profond MediaWiki / Pandoc -> Markdown propre
          img_html_re = re.compile(r"<img[^>]*>", re.IGNORECASE)
          img_md_re = re.compile(r"!\[[^\]]*\]\([^\)]*\)", re.IGNORECASE)
          nav_re = re.compile(r"^⏵\s*\[documentation index\].*$", re.MULTILINE)
          div_re = re.compile(r"</?div[^>]*>", re.IGNORECASE)
          nowiki_re = re.compile(r"</?nowiki>", re.IGNORECASE)
          navi_tpl_re = re.compile(r"\{\{[^}]*navi[^}]*\}\}", re.IGNORECASE)
          title_prop_re = re.compile(r"\{\{(?:TitleProperty|Properties_Title)\|([^}]+)\}\}", re.IGNORECASE)
          inline_tpl_re = re.compile(r"\{\{(?:Incode|incode|Value|value|Button|button|KEY)\|([^}]+)\}\}")
          code_block_re = re.compile(
              r"\{\{[Cc]ode\|(?:lang=([a-zA-Z0-9_+-]+)\|)?code=\s*(.*?)\}\}",
              re.DOTALL
          )
          redirect_re = re.compile(r"^\s*(?:1\.\s*REDIRECT|#REDIRECT)\s+", re.IGNORECASE | re.MULTILINE)

          # Exclusions du bruit non-technique (brouillons, notes de version historiques, icônes, traductions)
          exclude_prefixes = (
              "sandbox_", "talk;", "category_", "artwork", "release_notes_",
              "google_summer_of_code", "gsoc_", "crowdin", "donate", " swag"
          )
          exclude_exact = {
              "german_translation.md", "french_translation.md", "italian_translation.md",
              "polish_translation.md", "localisation.md", "localisation_sidebar.md",
              "translating_an_external_workbench.md", "fr_widget_basics.md",
              "free_cad_on_video.md", "freecad_on_video.md", "contributors.md"
          }

          def clean_md(text: str) -> str:
              text = img_html_re.sub("", text)
              text = img_md_re.sub("", text)
              text = nav_re.sub("", text)
              text = div_re.sub("", text)
              text = nowiki_re.sub("", text)
              text = navi_tpl_re.sub("", text)
              text = title_prop_re.sub(r"### \1", text)
              text = inline_tpl_re.sub(r"`\1`", text)
              text = code_block_re.sub(
                  lambda m: f"```{m.group(1) or 'bash'}\n{m.group(2).strip()}\n```",
                  text
              )
              return re.sub(r"\n{3,}", "\n\n", text).strip()

          def is_valid_tech_doc(f: Path, raw_text: str) -> tuple[bool, str]:
              lname = f.name.lower()
              if not f.name.isascii():
                  return False, "Non-ASCII/Traduction"
              if f.stat().st_size < 250 or redirect_re.search(raw_text[:200]):
                  return False, "Stub/Redirection"
              if lname in exclude_exact or lname.startswith(exclude_prefixes):
                  return False, "Hors-Périmètre (Meta/Sandbox)"
              return True, "Technique"

          bundles = {
              "01_CORE_API_OCCT.md": [],
              "02_CAM_PATH_CNC.md": [],
              "03_FEM_SOLVERS_CFD_EM.md": [],
              "04_CAD_PART_SKETCHER_ASSY_TECHDRAW.md": [],
              "05_SURFACE_CURVES_DRAFT_GEAR_ROBOT_MACROS.md": [],
          }

          index_rows = []
          tech_total = 0

          for f in all_en_md:
              raw = f.read_text(encoding="utf-8", errors="replace")
              valid, status = is_valid_tech_doc(f, raw)
              size = f.stat().st_size
              index_rows.append(f"| `{f.name}` | {size} | {status} |")
              if not valid:
                  continue

              tech_total += 1
              lname = f.name.lower()

              # 1. CAM / CNC / OpenCamLib (Priorité haute pour garder CAM_scripting.md ici)
              if lname.startswith(("cam_", "path_")) or lname in {"opencamlib.md"}:
                  bundles["02_CAM_PATH_CNC.md"].append((f.name, clean_md(raw)))

              # 2. FEM / Solveurs / Matériaux / CFD / Électromagnétisme
              elif (
                  lname.startswith(("fem_", "fembygen_", "cfd", "em_"))
                  or "fem" in lname
                  or "elmersolver" in lname
                  or lname.startswith("material")
              ):
                  bundles["03_FEM_SOLVERS_CFD_EM.md"].append((f.name, clean_md(raw)))

              # 3. CAO Solide, Sketcher (incluant Sketcher_scripting.md), Assemblage, Tôlerie, TechDraw, Mesh, OpenSCAD
              elif lname.startswith((
                  "part_", "part.", "partdesign_", "sketcher", "sketch.", "sheetmetal_",
                  "assembly", "a2plus", "techdraw", "mesh", "openscad_", "import_open", "export_to_stl"
              )):
                  bundles["04_CAD_PART_SKETCHER_ASSY_TECHDRAW.md"].append((f.name, clean_md(raw)))

              # 4. Surfaces NURBS, Courbes, Draft, Engrenages, Visserie, Robotique, Tableurs, Macros
              elif lname.startswith((
                  "surface_", "curves_", "curvedshapes", "draft_", "fcgear_", "fastener",
                  "robot_", "spreadsheet", "macro_", "macros", "import_export", "dxf", "svg"
              )):
                  bundles["05_SURFACE_CURVES_DRAFT_GEAR_ROBOT_MACROS.md"].append((f.name, clean_md(raw)))

              # 5. Core, API C++/Python, OpenCASCADE, App_*, Std_*, Compilation, Headless, Math/Topologie
              else:
                  bundles["01_CORE_API_OCCT.md"].append((f.name, clean_md(raw)))

          # Écriture de l'index maître
          index_header = [
              "# Liste Exhaustive des Documents Anglais FreeCAD-documentation\n",
              f"* **Total des fichiers `.md` à la racine de `wiki/`** : {len(all_en_md)}",
              f"* **Documents techniques retenus et intégrés à 100 % dans les 5 packs** : {tech_total}\n",
              "| Fichier | Taille (octets) | Statut |",
              "| :--- | :---: | :--- |",
          ]
          (out_dir / "00_INDEX_EXHAUSTIF_EN.md").write_text(
              "\n".join(index_header + index_rows) + "\n", encoding="utf-8"
          )

          for bundle_name, entries in bundles.items():
              chunks = [f"# Référentiel Technique FreeCAD : {bundle_name}\n\nPages compilées : **{len(entries)}**\n"]
              for fname, content in entries:
                  chunks.append(f"\n---\n## Fichier : `{fname}`\n\n{content}\n")
              out_file = out_dir / bundle_name
              out_file.write_text("".join(chunks), encoding="utf-8")
              print(f"[SKILL-BUILD-V2] {bundle_name} -> {len(entries)} pages ({out_file.stat().st_size // 1024} Ko)")
          EOF
          ls -lh _skill_architect/
