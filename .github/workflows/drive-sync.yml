name: Sync to Google Drive

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt officiel FreeCAD (Git natif sans Node.js)
        run: |
          rm -rf ./* ./.??* || true
          git clone --depth 1 --single-branch https://github.com/FreeCAD/FreeCAD-documentation.git .

      - name: Compiler l'index exhaustif et les packs Markdown pour freecad-cfao-turbo-architect
        shell: python3
        run: |
          import re
          from pathlib import Path

          wiki_dir = Path("wiki")
          out_dir = Path("_skill_architect")
          out_dir.mkdir(exist_ok=True)

          # Sélection stricte des fichiers Markdown en anglais (racine de wiki/ uniquement)
          all_en_md = sorted(
              [f for f in wiki_dir.iterdir() if f.is_file() and f.suffix == ".md"],
              key=lambda p: p.name.lower()
          )

          # Nettoyage des balises HTML d'images et pieds de page de navigation MediaWiki
          img_re = re.compile(r"<img[^>]*>", re.IGNORECASE)
          nav_re = re.compile(r"^⏵\s*\[documentation index\].*$", re.MULTILINE)

          def clean_md(text: str) -> str:
              text = img_re.sub("", text)
              text = nav_re.sub("", text)
              return re.sub(r"\n{3,}", "\n\n", text).strip()

          # 1. Génération de la liste exhaustive et intégrale (00_INDEX_EXHAUSTIF_EN.md)
          index_lines = [
              "# Liste Exhaustive des Documents Anglais FreeCAD-documentation\n",
              f"Total des fichiers `.md` en anglais à la racine de `wiki/` : **{len(all_en_md)}**\n",
              "| Fichier | Taille (octets) | Statut |",
              "| :--- | :---: | :--- |"
          ]
          for f in all_en_md:
              size = f.stat().st_size
              status = "Technique" if size >= 250 else "Stub/Redirection"
              index_lines.append(f"| `{f.name}` | {size} | {status} |")

          (out_dir / "00_INDEX_EXHAUSTIF_EN.md").write_text("\n".join(index_lines) + "\n", encoding="utf-8")

          # 2. Règles de routage vers les packs thématiques de la compétence (hors stubs < 250 octets)
          core_exact = {
              "source_documentation.md", "compile_on_linux.md", "compiling_(speeding_up).md",
              "doxygen.md", "std_dependencygraph.md", "developer_hub.md", "power_users_hub.md",
              "python_scripting_tutorial.md", "freecad_scripting_basics.md", "part_scripting.md",
              "topological_data_scripting.md", "part_toposhape.md", "featurepython_objects.md",
              "scripted_objects.md", "scenegraph.md", "coin3d.md", "mesh_scripting.md",
              "opencascade.md", "vertex.md", "edge.md", "wire.md", "face.md", "shell.md",
              "solid.md", "compsolid.md", "compound.md", "arc.md", "circle.md", "line.md",
              "ellipse.md", "cone.md", "bsplinecurve.md", "bsplinesurface.md", "beziercurve.md",
              "cylinder.md", "point.md", "sphere.md", "shape.md"
          }

          bundles = {
              "01_CORE_API_OCCT.md": [],
              "02_CAM_PATH_CNC.md": [],
              "03_FEM_SOLVERS.md": [],
              "04_CAD_PART_SKETCHER_TECHDRAW.md": [],
          }

          for f in all_en_md:
              if f.stat().st_size < 250:
                  continue
              lname = f.name.lower()
              if lname in core_exact or "scripting" in lname or lname.startswith("std_"):
                  bundles["01_CORE_API_OCCT.md"].append(f)
              elif lname.startswith(("cam_", "path_")):
                  bundles["02_CAM_PATH_CNC.md"].append(f)
              elif lname.startswith("fem_"):
                  bundles["03_FEM_SOLVERS.md"].append(f)
              elif lname.startswith(("part_", "partdesign_", "sketcher_", "sheetmetal_", "assembly", "techdraw_", "mesh_", "openscad_")):
                  bundles["04_CAD_PART_SKETCHER_TECHDRAW.md"].append(f)

          for bundle_name, files in bundles.items():
              chunks = [f"# Référentiel Technique FreeCAD : {bundle_name}\n\nPages compilées : **{len(files)}**\n"]
              for f in files:
                  content = clean_md(f.read_text(encoding="utf-8", errors="replace"))
                  chunks.append(f"\n---\n## Fichier : `{f.name}`\n\n{content}\n")
              (out_dir / bundle_name).write_text("".join(chunks), encoding="utf-8")
              print(f"[SKILL-BUILD] {bundle_name} -> {len(files)} fichiers intégrés.")

      - name: Installer rclone (Binaire statique officiel)
        run: |
          if ! command -v rclone >/dev/null 2>&1; then
            RCLONE_TAG=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/rclone/rclone/releases/latest | sed 's#.*/##')
            curl -fsSL "https://github.com/rclone/rclone/releases/download/${RCLONE_TAG}/rclone-${RCLONE_TAG}-linux-amd64.zip" -o rclone.zip \
              || curl -fsSL "https://github.com/rclone/rclone/releases/download/v1.68.2/rclone-v1.68.2-linux-amd64.zip" -o rclone.zip
            unzip -q rclone.zip
            sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/rclone
            sudo chmod 755 /usr/local/bin/rclone
            rm -rf rclone.zip rclone-*-linux-amd64
          fi
          rclone version

      - name: Configurer rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          printf "\nroot_folder_id = %s\n" "$GDRIVE_FOLDER_ID" >> ~/.config/rclone/rclone.conf

      - name: Lancer la synchronisation
        run: |
          rclone sync ./ gdrive: \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --checksum \
            --no-update-modtime \
            --fast-list \
            --drive-pacer-min-sleep 50ms \
            --drive-pacer-burst 100 \
            --tpslimit 10 \
            --tpslimit-burst 10 \
            --transfers 8 \
            --checkers 16 \
            --stats 30s \
            --stats-one-line \
            --log-level DEBUG
