name: Sync to Google Drive

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt officiel FreeCAD
        uses: actions/checkout@v4
        with:
          repository: FreeCAD/FreeCAD-documentation

      - name: Installer rclone
        run: sudo apt-get install -y rclone

      - name: Configurer rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          echo "root_folder_id = $GDRIVE_FOLDER_ID" >> ~/.config/rclone/rclone.conf

      - name: Lancer la synchronisation
        run: |
          rclone sync ./ gdrive: --exclude ".git/**" --exclude ".github/**"
