name: Sync to Google Drive

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt officiel FreeCAD
        uses: actions/checkout@v4
        with:
          repository: FreeCAD/FreeCAD-documentation
          fetch-depth: 1

      - name: Installer rclone (Binaire statique officiel)
        run: |
          if ! command -v rclone >/dev/null 2>&1; then
            RCLONE_TAG=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/rclone/rclone/releases/latest | sed 's#.*/##')
            curl -fsSL "https://github.com/rclone/rclone/releases/download/${RCLONE_TAG}/rclone-${RCLONE_TAG}-linux-amd64.zip" -o rclone.zip \
              || curl -fsSL "https://github.com/rclone/rclone/releases/download/v1.68.2/rclone-v1.68.2-linux-amd64.zip" -o rclone.zip
            unzip -q rclone.zip
            sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/rclone
            sudo chmod 755 /usr/local/bin/rclone
            rm -rf rclone.zip rclone-*-linux-amd64
          fi
          rclone version

      - name: Configurer rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          printf "\nroot_folder_id = %s\n" "$GDRIVE_FOLDER_ID" >> ~/.config/rclone/rclone.conf

      - name: Lancer la synchronisation
        run: |
          rclone sync ./ gdrive: \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --checksum \
            --no-update-modtime \
            --fast-list \
            --drive-pacer-min-sleep 100ms \
            --drive-pacer-burst 50 \
            --tpslimit 8 \
            --tpslimit-burst 8 \
            --transfers 4 \
            --checkers 8 \
            --stats 30s \
            --log-level DEBUG
